[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "modelport"
version = "0.1.0"
description = "Local model conversion with reproducible evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["onnx", "pytorch", "model-conversion", "quantization", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.12,<3", "fastapi>=0.128,<1", "uvicorn>=0.40,<1",
  "sqlalchemy>=2.0.45,<3", "alembic>=1.17,<2", "typer>=0.21,<1",
  "rich>=14,<15", "numpy>=2.2,<3", "httpx>=0.28,<1",
  "python-multipart>=0.0.22,<1", "psutil>=7.2,<8",
  "packaging>=24,<27",
  "httpcore>=1.0.9,<2",
]

[project.optional-dependencies]
cpu = ["torch==2.13.0", "onnx>=1.20,<2", "onnxruntime>=1.23,<2", "onnxscript>=0.5,<1", "safetensors>=0.7,<1"]

[project.urls]
Homepage = "https://github.com/AlBrmagawi/modelport"
Documentation = "https://github.com/AlBrmagawi/modelport/blob/main/docs/README.md"
Repository = "https://github.com/AlBrmagawi/modelport.git"
Issues = "https://github.com/AlBrmagawi/modelport/issues"
Changelog = "https://github.com/AlBrmagawi/modelport/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "mypy>=1.19,<2", "types-psutil", "pip-audit>=2.9,<3", "build>=1.3,<2"]

[project.scripts]
modelport = "modelport.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/modelport"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/examples", "/docs", "/docker", "/web/src",
  "/web/tests", "/web/scripts", "/web/*.json", "/web/*.ts", "/web/*.html", "/web/*.md",
  "/.github", "/.gitignore", "/.dockerignore", "/.gitleaks.toml", "/.env.example",
  "/.python-version", "/CONTRIBUTING.md", "/web/.prettierignore",
  "/.editorconfig", "/.gitattributes", "/CHANGELOG.md", "/SUPPORT.md",
  "/pyproject.toml", "/uv.lock", "/hatch_build.py", "/README.md", "/PROGRESS.md",
  "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md", "/SECURITY.md", "/start-modelport.cmd",
]
exclude = [
  "**/__pycache__", "**/*.pyc", "**/node_modules", "**/.env", "**/.env.*",
  "**/operator-token", "**/modelport.db*", "**/*.pem", "**/*.key",
  "!/.env.example",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real native CPU workflows"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src/modelport"]
