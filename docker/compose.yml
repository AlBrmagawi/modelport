name: modelport
services:
  modelport:
    image: modelport:${MODELPORT_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${MODELPORT_PORT:-8765}:8765"
    environment:
      MODELPORT_ALLOWED_ORIGINS: http://127.0.0.1:${MODELPORT_PORT:-8765},http://localhost:${MODELPORT_PORT:-8765}
    volumes:
      - modelport-data:/data
    mem_limit: 6g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  modelport-data:
